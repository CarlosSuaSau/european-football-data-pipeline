name: V4 CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/carlossuasau/football-pipeline
  AZURE_RESOURCE_GROUP: rg-football-pipeline-v4
  AZURE_JOB_NAME: football-pipeline-daily

jobs:
  ci:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall \
            api.py \
            transform.py \
            database.py \
            main.py \
            run_pipeline.py

      - name: Validate dbt project
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: football_db
          DB_USER: ci
          DB_PASSWORD: ci
          DB_SSLMODE: prefer
        run: |
          dbt parse \
            --project-dir dbt_football \
            --profiles-dir dbt_football \
            --target prod

  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: ci

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Azure Container Apps Job
        run: |
          az containerapp job update \
            --name "${AZURE_JOB_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Show deployed image
        run: |
          az containerapp job show \
            --name "${AZURE_JOB_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query "properties.template.containers[0].image" \
            --output tsv